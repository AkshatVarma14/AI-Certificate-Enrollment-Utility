{% extends "base.html" %}
{% block title %}CertEn – Certificate Enrollment{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-6 py-12 gap-16 flex-col md:flex-row">

  <!-- ── Left: Sign-in ───────────────────────────────────────────── -->
  <div class="flex flex-col gap-6 w-full max-w-md">
    <div>
      <h1 class="font-serif text-navy text-5xl sm:text-6xl leading-tight mb-3">
        Certificate<br>Enrollment
      </h1>
      <p class="text-gray-500 text-base max-w-sm">
        Complete your training programs and earn recognised certificates with CertEn.
      </p>
    </div>

    <form action="{{ url_for('signin') }}" method="POST" class="flex flex-col items-center gap-3 w-full">
      <input
        type="email"
        name="email"
        class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-600 placeholder-gray-400 text-base
               focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition"
        placeholder="Email"
        required
        autocomplete="email"
      />
      <button type="submit"
              class="w-48 bg-navy text-white font-semibold rounded-full py-3 text-base
                     hover:brightness-110 hover:-translate-y-0.5 active:translate-y-0 transition-all">
        Sign In
      </button>
    </form>

    <div class="flex justify-center">
      <a href="{{ url_for('register') }}"
         class="text-sm text-navy underline underline-offset-4 hover:text-primary transition-colors">
        Not Registered yet? Register now
      </a>
    </div>
  </div>

  <!-- ── Right: Static certificate image ─────────────────────────── -->
  <div class="hidden md:flex flex-1 max-w-lg justify-center items-center">
    <img src="{{ url_for('static', filename='images/CertificateImage.png') }}"
         alt="Certificate of Achievement"
         class="w-full max-w-md drop-shadow-xl rounded-sm object-contain">
  </div>

</section>
{% endblock %}
