<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CertEn{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ── Navbar ────────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="navbar__brand">
      <!-- CertEn Cube Logo (SVG) -->
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 3L33 11.5V24.5L18 33L3 24.5V11.5L18 3Z" fill="#2563EB" opacity="0.15"/>
        <path d="M18 3L33 11.5V24.5L18 33" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
        <path d="M18 3L3 11.5V24.5L18 33" stroke="#1E3A8A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M3 11.5L18 20L33 11.5" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
        <path d="M18 20V33" stroke="#1E3A8A" stroke-width="2"/>
      </svg>
      <span>CertEn</span>
    </a>

    <div class="navbar__links">
      {% block nav_links %}
      <a href="#" class="navbar__link navbar__link--active">Option 1</a>
      <a href="#" class="navbar__link">Option 1</a>
      <a href="#" class="navbar__link">Option 1</a>
      <a href="#" class="navbar__link">Option 1</a>
      {% endblock %}
    </div>
  </nav>

  <!-- ── Flash Messages ────────────────────────────────────────── -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash--{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- ── Page Content ──────────────────────────────────────────── -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
