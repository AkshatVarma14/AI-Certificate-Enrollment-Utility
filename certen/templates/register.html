{% extends "base.html" %}
{% block title %}CertEn – Enrollment Form{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- Page heading -->
  <h2 class="font-serif text-3xl text-center text-gray-900 mb-8">Enrollment Form</h2>

  <!-- Two-column card layout (side-by-side on md+, stacked on mobile) -->
  <form id="enroll-form" action="{{ url_for('register_submit') }}" method="POST"
        class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- ── Personal Details ─────────────────────────────────────── -->
    <div class="bg-white rounded-2xl shadow-sm border-l-4 border-primary p-8 flex flex-col gap-5">
      <h3 class="text-xl font-bold text-primary text-center">Personal Details</h3>

      <!-- First Name -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-800">First Name</label>
        <input type="text" name="first_name" required
               placeholder="Enter your First Name"
               class="enroll-input border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-500 placeholder-gray-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
      </div>

      <!-- Last Name -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-800">Last Name</label>
        <input type="text" name="last_name" required
               placeholder="Enter your Last Name"
               class="enroll-input border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-500 placeholder-gray-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
      </div>

      <!-- Date of Birth -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-800">Date of Birth</label>
        <div class="flex gap-2">
          <select name="dob_day" required
                  class="enroll-input flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
            <option value="">Day</option>
            {% for d in range(1, 32) %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
          </select>
          <select name="dob_month" required
                  class="enroll-input flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
            <option value="">Month</option>
            {% for m in ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] %}
              <option value="{{ m }}">{{ m }}</option>
            {% endfor %}
          </select>
          <select name="dob_year" required
                  class="enroll-input flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
            <option value="">Year</option>
            {% for y in range(2010, 1949, -1) %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-800">Email</label>
        <input type="email" name="email" required
               placeholder="Enter your Email"
               class="enroll-input border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-500 placeholder-gray-400 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition" />
      </div>
    </div>

    <!-- ── Program Details ──────────────────────────────────────── -->
    <div class="bg-white rounded-2xl shadow-sm border-l-4 border-primary p-8 flex flex-col gap-5">
      <h3 class="text-xl font-bold text-primary text-center">Program Details</h3>

      <!-- Program -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-800">Program</label>
        <select name="program" required
                class="enroll-input w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
          <option value="">Not Selected</option>
          {% for p in programs %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
      </div>

      <!-- Mode -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-800">Mode</label>
        <select name="mode" required
                class="enroll-input w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
          <option value="">Not Selected</option>
          {% for m in modes %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
        </select>
      </div>

      <!-- Date -->
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-800">Date</label>
        <div class="flex gap-2">
          <select name="date_day" required
                  class="enroll-input flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
            <option value="">Day</option>
            {% for d in range(1, 32) %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
          </select>
          <select name="date_month" required
                  class="enroll-input flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
            <option value="">Month</option>
            {% for m in ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] %}
              <option value="{{ m }}">{{ m }}</option>
            {% endfor %}
          </select>
          <select name="date_year" required
                  class="enroll-input flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition">
            <option value="">Year</option>
            {% for y in range(2030, 2024, -1) %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <!-- Time Slot -->
      <div class="flex flex-col gap-2">
        <label class="text-sm font-semibold text-gray-800">Time Slot</label>

        <!-- From -->
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium text-gray-700 w-10">From</span>
          <select name="time_from_h"
                  class="enroll-input border border-gray-200 rounded-xl px-2 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary transition w-16">
            {% for h in range(0, 13) %}<option>{{ "%02d"|format(h) }}</option>{% endfor %}
          </select>
          <span class="font-bold text-gray-600">:</span>
          <select name="time_from_m"
                  class="enroll-input border border-gray-200 rounded-xl px-2 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary transition w-16">
            {% for m in range(0, 60, 15) %}<option>{{ "%02d"|format(m) }}</option>{% endfor %}
          </select>
          <select name="time_from_ampm"
                  class="enroll-input border border-gray-200 rounded-xl px-2 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary transition w-16">
            <option>AM</option><option>PM</option>
          </select>
        </div>

        <!-- To -->
        <div class="flex items-center gap-2">
          <span class="text-sm font-medium text-gray-700 w-10">To</span>
          <select name="time_to_h"
                  class="enroll-input border border-gray-200 rounded-xl px-2 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary transition w-16">
            {% for h in range(0, 13) %}<option>{{ "%02d"|format(h) }}</option>{% endfor %}
          </select>
          <span class="font-bold text-gray-600">:</span>
          <select name="time_to_m"
                  class="enroll-input border border-gray-200 rounded-xl px-2 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary transition w-16">
            {% for m in range(0, 60, 15) %}<option>{{ "%02d"|format(m) }}</option>{% endfor %}
          </select>
          <select name="time_to_ampm"
                  class="enroll-input border border-gray-200 rounded-xl px-2 py-2.5 text-sm text-gray-500 focus:outline-none focus:border-primary transition w-16">
            <option>AM</option><option>PM</option>
          </select>
        </div>
      </div>
    </div>

  </form><!-- end form grid -->

  <!-- ── Submit Button (full width, below both cards) ──────────── -->
  <div class="mt-6">
    <button id="enroll-btn"
            type="submit"
            form="enroll-form"
            disabled
            class="w-full rounded-full py-4 text-lg font-semibold text-white transition-all
                   bg-primary/40 cursor-not-allowed
                   disabled:opacity-60"
            title="Fill all fields to enable">
      Complete Enrollment
    </button>
    <p id="enroll-hint" class="text-center text-xs text-gray-400 mt-2">
      Please fill in all required fields to enable enrollment.
    </p>
  </div>

</div>

<script>
  // ── Enable / disable submit button based on form validity ────────
  const form    = document.getElementById('enroll-form');
  const btn     = document.getElementById('enroll-btn');
  const hint    = document.getElementById('enroll-hint');
  const inputs  = form.querySelectorAll('.enroll-input');

  function checkValidity() {
    const valid = form.checkValidity();
    btn.disabled = !valid;
    if (valid) {
      btn.classList.replace('bg-primary/40', 'bg-primary');
      btn.classList.replace('cursor-not-allowed', 'cursor-pointer');
      btn.classList.add('hover:brightness-110', 'hover:-translate-y-0.5', 'active:translate-y-0');
      hint.classList.add('hidden');
    } else {
      btn.classList.replace('bg-primary', 'bg-primary/40');
      btn.classList.replace('cursor-pointer', 'cursor-not-allowed');
      btn.classList.remove('hover:brightness-110', 'hover:-translate-y-0.5', 'active:translate-y-0');
      hint.classList.remove('hidden');
    }
  }

  inputs.forEach(el => el.addEventListener('input', checkValidity));
  inputs.forEach(el => el.addEventListener('change', checkValidity));
  checkValidity(); // run once on load
</script>
{% endblock %}
