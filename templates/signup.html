{% extends "base.html" %}
{% block title %}CertEn – Create Account{% endblock %}

{% block content %}
{# Full-viewport container — no scrolling #}
<div class="h-[calc(100vh-4rem)] flex flex-col justify-center px-4 sm:px-6">

  <div class="w-full max-w-2xl mx-auto">

    <!-- ── Header row: Back button + Title ────────────────────────── -->
    <div class="relative flex items-center justify-center mb-6">
      <!-- Back arrow (absolutely positioned left, vertically centred with title) -->
      <a href="{{ url_for('index') }}"
         class="absolute left-0 flex items-center gap-1.5 text-sm font-medium text-gray-500
                hover:text-primary transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
      <div class="text-center">
        <h2 class="font-serif text-2xl text-gray-900 leading-tight">Create Account</h2>
        <p class="text-xs text-gray-400 mt-0.5">Register to start your certification journey.</p>
      </div>
    </div>

    <!-- ── 2-column card ──────────────────────────────────────────── -->
    <form id="signup-form" action="{{ url_for('signup_submit') }}" method="POST"
          class="bg-white rounded-2xl shadow-sm border-t-4 border-primary px-8 py-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">

        <!-- ══ Column 1: First Name, Last Name, DOB ══ -->
        <div class="flex flex-col gap-4">

          <!-- First Name -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">First Name</label>
            <input type="text" name="first_name" required
                   placeholder="Enter your first name"
                   class="signup-input border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-600
                          placeholder-gray-400 focus:outline-none focus:border-primary
                          focus:ring-2 focus:ring-primary/10 transition" />
          </div>

          <!-- Last Name -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Last Name</label>
            <input type="text" name="last_name" required
                   placeholder="Enter your last name"
                   class="signup-input border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-600
                          placeholder-gray-400 focus:outline-none focus:border-primary
                          focus:ring-2 focus:ring-primary/10 transition" />
          </div>

          <!-- Date of Birth -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Date of Birth</label>
            <div class="flex gap-2">
              <select name="dob_day" required
                      class="signup-input flex-1 border border-gray-200 rounded-xl px-2 py-2 text-sm
                             text-gray-500 focus:outline-none focus:border-primary
                             focus:ring-2 focus:ring-primary/10 transition">
                <option value="">Day</option>
                {% for d in range(1, 32) %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
              </select>
              <select name="dob_month" required
                      class="signup-input flex-1 border border-gray-200 rounded-xl px-2 py-2 text-sm
                             text-gray-500 focus:outline-none focus:border-primary
                             focus:ring-2 focus:ring-primary/10 transition">
                <option value="">Month</option>
                {% for m in ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] %}
                  <option value="{{ m }}">{{ m }}</option>
                {% endfor %}
              </select>
              <select name="dob_year" required
                      class="signup-input flex-1 border border-gray-200 rounded-xl px-2 py-2 text-sm
                             text-gray-500 focus:outline-none focus:border-primary
                             focus:ring-2 focus:ring-primary/10 transition">
                <option value="">Year</option>
                {% for y in range(2010, 1949, -1) %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
              </select>
            </div>
          </div>

        </div><!-- /col 1 -->

        <!-- ══ Column 2: Email, Password, Confirm Password ══ -->
        <div class="flex flex-col gap-4">

          <!-- Email -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Email ID</label>
            <input type="email" name="email" required
                   placeholder="Enter your email"
                   class="signup-input border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-600
                          placeholder-gray-400 focus:outline-none focus:border-primary
                          focus:ring-2 focus:ring-primary/10 transition" />
          </div>

          <!-- Password -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Password</label>
            <div class="relative">
              <input type="password" name="password" id="pw1" required minlength="6"
                     placeholder="Min. 6 characters"
                     class="signup-input w-full border border-gray-200 rounded-xl px-3 py-2 pr-10 text-sm
                            text-gray-600 placeholder-gray-400 focus:outline-none focus:border-primary
                            focus:ring-2 focus:ring-primary/10 transition" />
              <button type="button" tabindex="-1"
                      aria-label="Toggle password visibility"
                      onclick="togglePw('pw1', this)"
                      class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
                <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                           -1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7
                           a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243
                           M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29
                           m7.532 7.532l3.29 3.29M3 3l3.59 3.59
                           m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7
                           a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wide">Re-enter Password</label>
            <div class="relative">
              <input type="password" name="confirm_password" id="pw2" required
                     placeholder="Re-enter your password"
                     class="signup-input w-full border border-gray-200 rounded-xl px-3 py-2 pr-10 text-sm
                            text-gray-600 placeholder-gray-400 focus:outline-none focus:border-primary
                            focus:ring-2 focus:ring-primary/10 transition" />
              <button type="button" tabindex="-1"
                      aria-label="Toggle password visibility"
                      onclick="togglePw('pw2', this)"
                      class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
                <svg class="eye-open w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
                           -1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <svg class="eye-closed w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7
                           a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243
                           M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29
                           m7.532 7.532l3.29 3.29M3 3l3.59 3.59
                           m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7
                           a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
            <p id="pw-mismatch" class="hidden text-xs text-red-500 mt-0.5">Passwords do not match.</p>
          </div>

        </div><!-- /col 2 -->

      </div><!-- /grid -->

      <!-- Submit -->
      <div class="mt-6">
        <button id="signup-btn" type="submit" disabled
                class="w-full rounded-full py-3 text-sm font-semibold text-white transition-all
                       bg-primary/40 cursor-not-allowed"
                title="Fill all fields to enable">
          Create Account
        </button>
      </div>

    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Already have an account?
      <a href="{{ url_for('index') }}"
         class="text-navy font-medium underline underline-offset-4 hover:text-primary transition-colors">
        Sign In
      </a>
    </p>

  </div>
</div>

<script>
  // ── Password visibility toggle ──────────────────────────────────
  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    btn.querySelector('.eye-open').classList.toggle('hidden', isHidden);
    btn.querySelector('.eye-closed').classList.toggle('hidden', !isHidden);
  }

  // ── Enable / disable submit ─────────────────────────────────────
  const form    = document.getElementById('signup-form');
  const btn     = document.getElementById('signup-btn');
  const pw1     = document.getElementById('pw1');
  const pw2     = document.getElementById('pw2');
  const mismatch = document.getElementById('pw-mismatch');
  const inputs  = form.querySelectorAll('.signup-input');

  function checkValidity() {
    const match = pw1.value === pw2.value;
    mismatch.classList.toggle('hidden', match || pw2.value === '');
    const valid = form.checkValidity() && match;
    btn.disabled = !valid;
    if (valid) {
      btn.classList.replace('bg-primary/40', 'bg-primary');
      btn.classList.replace('cursor-not-allowed', 'cursor-pointer');
      btn.classList.add('hover:brightness-110', 'hover:-translate-y-0.5', 'active:translate-y-0');
    } else {
      btn.classList.replace('bg-primary', 'bg-primary/40');
      btn.classList.replace('cursor-pointer', 'cursor-not-allowed');
      btn.classList.remove('hover:brightness-110', 'hover:-translate-y-0.5', 'active:translate-y-0');
    }
  }

  inputs.forEach(el => el.addEventListener('input', checkValidity));
  inputs.forEach(el => el.addEventListener('change', checkValidity));
  checkValidity();
</script>
{% endblock %}
